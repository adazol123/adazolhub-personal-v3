      <path d="M-34 32v5m6-5v5m6-5v5m6-5v5m6-5v5m6-5v5m6-5v5m6-5v5m6-5v5m6-5v5m6-5v5m6-5v5" stroke="#d2a769" stroke-width="2.6"/>
    </g>
    <g id="wire-row" fill="none" stroke="url(#gold)" stroke-width=".76" stroke-linecap="round">
      <path d="M-20-20Q-29-36-32-35M-16-20Q-23-36-26-35M-12-20Q-17-36-20-35M-8-20Q-12-36-14-35M-4-20Q-6-36-8-35M0-20Q-1-36-2-35M4-20Q5-36 4-35M8-20Q11-36 10-35M12-20Q17-36 16-35M16-20Q23-36 22-35M20-20Q28-36 28-35"/>
    </g>
  </defs>
  <!-- Component drawings share the board's top-down coordinate system. -->
  <g id="board">
    <use href="#board-edge" fill="#121e19" transform="translate(2 6)"/>
    <use href="#board-edge" fill="#b2a06c" transform="translate(1 3.5)"/>
    <use href="#board-edge" fill="url(#mask)" stroke="#759482" stroke-width="1.2"/>
    <use href="#board-edge" fill="url(#grain)" opacity=".65"/>
    <use href="#routes"/><use href="#routes" transform="rotate(180)"/>
    <g stroke="#c9d1bc" fill="none" stroke-width=".9" opacity=".85">
      <path d="M-111-59v-12h18m187-1h13v14m-3 111v15H89m-180 1h-19v-13"/>
      <path d="M-45-27v-16h16m57 0h15v16m0 55v15H28m-57 0h-16V28"/>
      <rect x="64" y="-56" width="38" height="17" rx="2"/><rect x="-102" y="37" width="36" height="13" rx="1"/>
    </g>
    <use href="#hole" x="-113" y="-70"/><use href="#hole" x="111" y="-68"/><use href="#hole" x="-113" y="66"/><use href="#hole" x="111" y="66"/>
    <use href="#land-row"/><use href="#land-row" transform="rotate(90)"/><use href="#land-row" transform="rotate(180)"/><use href="#land-row" transform="rotate(270)"/>
    <g fill="#d8e4cc" font-family="monospace" font-size="5.4">
      <text x="-52" y="-47">U1</text><text x="-103" y="33">C4 C5 C6</text><text x="67" y="-60">Y1</text><text x="68" y="64">J1</text>
    </g>
    <g><use href="#via" x="-106" y="-32"/><use href="#via" x="-107" y="31"/><use href="#via" x="-62" y="72"/><use href="#via" x="-51" y="76"/>
      <use href="#via" x="62" y="-72"/><use href="#via" x="51" y="-76"/><use href="#via" x="106" y="32"/><use href="#via" x="108" y="-32"/></g>
    <use href="#smd" x="-95" y="44"/><use href="#smd" x="-83" y="44"/><use href="#smd" x="-71" y="44"/>
    <use href="#smd" x="76" y="15"/><use href="#smd" x="89" y="15"/>
    <rect x="66" y="-54" width="33" height="13" rx="3" fill="url(#metal)" stroke="#414f48"/>
    <path d="M70-51h25" stroke="#edf0db" stroke-width="1.2"/>
    <g fill="#cdb890" stroke="#182b25" stroke-width="1"><circle cx="72" cy="52" r="3.8"/><circle cx="83" cy="52" r="3.8"/><circle cx="94" cy="52" r="3.8"/></g>
  </g>
  <g id="die">
    <use href="#lead-row"/><use href="#lead-row" transform="rotate(90)"/><use href="#lead-row" transform="rotate(180)"/><use href="#lead-row" transform="rotate(270)"/>
    <rect x="-28" y="-28" width="56" height="56" rx="2" fill="#624d39" stroke="#ebc59a"/>
    <rect x="-26" y="-26" width="52" height="52" fill="#222e2e" stroke="url(#metal)" stroke-width="1.7"/>
    <rect x="-23" y="-23" width="46" height="46" fill="url(#cells)" stroke="#c4ac84" stroke-width="1"/>
    <rect x="-20" y="-20" width="17" height="28" fill="url(#memory)" stroke="#b7ae8d" stroke-width=".7"/>
    <rect x="1" y="-17" width="18" height="12" fill="url(#memory)" stroke="#c1b18d" stroke-width=".7"/>
    <path d="M-20 11H-1V0h21M-20 14H2V3h18" stroke="#c6ab77" stroke-width=".8" fill="none"/>
    <use href="#wire-row"/><use href="#wire-row" transform="rotate(90)"/><use href="#wire-row" transform="rotate(180)"/><use href="#wire-row" transform="rotate(270)"/>
  </g>
  <g id="package">
    <rect x="-38" y="-38" width="77" height="78" rx="3" fill="#202827" transform="translate(1 5)"/>
    <path d="M-39-34l5-5h69l4 4v69l-4 5h-70l-4-5z" fill="url(#epoxy)" stroke="#848b83" stroke-width=".8"/>
    <path d="M-39-34l5-5h69l4 4v69l-4 5h-70l-4-5z" fill="url(#grain)"/>
    <circle cx="-30" cy="-29" r="3" fill="#292f2d" stroke="#858e80" stroke-width=".7"/>
    <text x="0" y="1" text-anchor="middle" fill="#dfdfce" font-family="monospace" font-size="12" letter-spacing="1">MCU</text>
    <path d="M-15 8h30m-30 3h18" stroke="#a0a693" stroke-width="1.1"/>
  </g>
