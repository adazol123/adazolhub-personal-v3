<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mask" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#466d60"/><stop offset=".49" stop-color="#264e48"/><stop offset="1" stop-color="#173832"/>
    </linearGradient>
    <linearGradient id="epoxy" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#626a67"/><stop offset=".48" stop-color="#414846"/><stop offset="1" stop-color="#303534"/>
    </linearGradient>
    <linearGradient id="gold" x2="1" y2=".45" gradientUnits="objectBoundingBox">
      <stop stop-color="#825b37"/><stop offset=".35" stop-color="#f5d29a"/><stop offset=".65" stop-color="#bd8954"/><stop offset="1" stop-color="#f6d5a4"/>
    </linearGradient>
    <linearGradient id="metal" x2="1" y2=".65" gradientUnits="objectBoundingBox">
      <stop stop-color="#777f80"/><stop offset=".33" stop-color="#dce0d9"/><stop offset=".54" stop-color="#949d9c"/><stop offset="1" stop-color="#596262"/>
    </linearGradient>
    <pattern id="grain" width="3.5" height="4" patternUnits="userSpaceOnUse">
      <path d="M.3.5h.55M2.4 2.8h.35" stroke="#fff" stroke-width=".4" opacity=".26"/>
      <path d="M1.1 2h.35" stroke="#000" stroke-width=".5"/>
    </pattern>
    <pattern id="memory" width="3.2" height="4" patternUnits="userSpaceOnUse">
      <rect width="3.2" height="4" fill="#586458"/><path d="M0 1h3m-3 1.5h3" stroke="#c3b397" stroke-width=".45"/>
      <path d="M2.7 0v4" stroke="#283b36" stroke-width=".4"/>
    </pattern>
    <pattern id="cells" width="7" height="6" patternUnits="userSpaceOnUse">
      <rect width="7" height="6" fill="#766356"/><path d="M0 1h4v3h3M1 6V3h2" stroke="#d9bd88" stroke-width=".65" fill="none"/>
      <path d="M4.8 0v2.3H7" stroke="#575a4d" stroke-width="1"/>
    </pattern>
    <pattern id="lands" width="6" height="7" patternUnits="userSpaceOnUse">
      <rect x=".8" width="3.8" height="7" rx=".7" fill="url(#gold)"/>
    </pattern>
    <pattern id="contacts" width="6" height="16" patternUnits="userSpaceOnUse">
      <path d="M.8 0h3.7v6l-.4 6.8H5v3H.2v-3h.6z" fill="url(#metal)" stroke="#424b47" stroke-width=".5"/>
    </pattern>
    <g id="via"><circle r="2.1" fill="#c5a974"/><circle r="1.15" fill="#122b27"/></g>
    <g id="hole"><circle r="5" fill="#d0b788"/><circle r="3.3" fill="#152825" stroke="#8a9a86" stroke-width=".7"/></g>
    <g id="smd"><rect x="-5.2" y="-2.8" width="10.4" height="6" rx=".6" fill="#142923"/>
      <rect x="-5" y="-3.3" width="10" height="5.4" rx=".6" fill="url(#metal)"/><rect x="-3" y="-3.3" width="6" height="5.3" fill="#ac906e"/></g>
    <g id="routes" fill="none" stroke="#bba56c" stroke-width=".8" opacity=".82">
      <path d="M-32-45v-11l-8-8h-32l-8-8h-28m82 27v-13l-9-9h-33l-7-7h-34m89 29v-16l-9-9h-32l-8-8h-39"/>
      <path d="M-44-15h-20l-9-9h-23l-10-10h-15m77 25h-24l-11-11h-18l-12-12h-12m77 29h-28l-12-12h-18l-11-10h-8"/>
      <path d="M-44 9h-18l-12 12h-28l-10 10h-10m78-16h-16l-12 12h-26l-10 10h-15m79-16h-13l-12 12h-26l-10 10h-15"/>
      <path d="M-32 45v9l-14 14h-25m45-23v13l-14 14h-22m42-27v16l-15 15h-16"/>
    </g>
    <g id="board-edge"><path d="M-120-81H114l10 10V68l-12 12h-228l-9-9V-73z"/></g>
    <g id="land-row"><rect x="-36" y="-48" width="72" height="7" fill="url(#lands)"/></g>
    <g id="lead-row">
